.event.role-player{border-left-color:#7883ba}.event.role-player:before{background:#8994ce}.event.role-gm{border-left-color:#638970}.event.role-gm:before{background:#8fb996}.session-card.role-gm{border-left:2px solid #638970;padding-left:12px}.session-card.role-player{border-left:2px solid #7883ba;padding-left:12px}

.optional-label{font-size:10px;color:#8291a9;font-weight:400;display:inline}.module-field>label{position:relative}.module-field>label .optional-label{position:absolute;right:0;top:1px}.module-field input:disabled{opacity:.65;cursor:not-allowed;background:#2d3043;color:#cbc9a3;border-color:#5d5b45}.event.role-gm,.sessions .session-card.role-gm,.chronicle-entry.role-gm{background:rgba(143,185,150,.09);border-left-color:#638970}.event.role-gm .session-title,.sessions .role-gm .session-title,.chronicle-entry.role-gm .session-title{color:#a4c9ae}.event.role-player .session-title,.sessions .role-player .session-title,.chronicle-entry.role-player .session-title{color:#a9afe0}.event.is-oneshot.role-gm,.event.is-oneshot.role-player,.sessions .session-card.is-oneshot,.chronicle-entry.is-oneshot.role-gm,.chronicle-entry.is-oneshot.role-player{background:rgba(196,171,105,.12);border-left:2px solid #c4ab69}.event.is-oneshot.role-gm:before,.event.is-oneshot.role-player:before{background:#c4ab69}.chronicle-entry.is-oneshot.selected{box-shadow:inset 0 0 0 1px #c4ab6933}.event.is-oneshot.role-gm b,.sessions .session-card.is-oneshot.role-gm h3,.chronicle-entry.is-oneshot.role-gm b{color:#a4c9ae}.event.is-oneshot.role-player b,.sessions .session-card.is-oneshot.role-player h3,.chronicle-entry.is-oneshot.role-player b{color:#a9afe0}

/* Shared session palette: role controls text; one-shot only overrides surface. */
:root{--player-session-bg:rgba(115,127,166,.12);--master-session-bg:rgba(143,185,150,.09)}
.event.role-player,.sessions .session-card.role-player,.chronicle-entry.role-player{background:var(--player-session-bg)}
.event.role-gm,.sessions .session-card.role-gm,.chronicle-entry.role-gm{background:var(--master-session-bg)}
.event.role-player em{color:#a9afe0}.event.role-gm em{color:#a4c9ae}

.event.is-oneshot.role-gm,.event.is-oneshot.role-player,.sessions .session-card.is-oneshot,.chronicle-entry.is-oneshot.role-gm,.chronicle-entry.is-oneshot.role-player{background:rgba(196,171,105,.12);border-left:2px solid #c4ab69}

/* A one-pixel accent and one-pixel spaces make equal session tiles. */
.timeline{display:flex;flex-direction:column;gap:1px}
.timeline>.event.role-player,.timeline>.event.role-gm{border-left-width:1px}
.chronicle-scroll{display:flex;flex-direction:column;gap:1px}
.chronicle-entry{margin-bottom:0;border-top:0;border-left-width:1px}
.chronicle-entry.is-oneshot.role-gm,.chronicle-entry.is-oneshot.role-player{border-left-width:1px}
.sessions{display:flex;flex-direction:column;gap:1px}
.sessions .session-card{border-bottom:0;border-left-width:1px}
.journal-mode{display:flex;margin:0 20px 18px;gap:4px;border-bottom:1px solid #394456}
.journal-mode button{flex:1;font-size:11px;background:none;border:0;border-radius:0;color:#95a3b9;padding:11px 6px}
.journal-mode button.on{color:#b9d7c0;border-bottom:2px solid #8fb996;background:#8fb9960c}
.role-session-chart{padding:0 20px 24px;text-align:center;min-height:400px}
.role-session-chart>p{font-size:11px;margin:0 0 20px}
.role-columns{display:flex;justify-content:center;gap:60px}
.role-column{display:flex;flex-direction:column;align-items:center;min-width:85px}
.role-column h3{font-size:13px;margin:0 0 12px;font-weight:500}
.role-column strong{font-size:29px;font-variant-numeric:tabular-nums;font-weight:500}
.role-column.gm h3,.role-column.gm strong{color:#a4c9ae}
.role-column.player h3,.role-column.player strong{color:#a9afe0}
.role-denominator{color:#8697ac;font-size:10px;margin-top:5px}
.role-column svg{width:48px;height:260px;display:block;margin:10px 0}
.role-column small{font-size:10px;color:#c4ab69}
.role-chart-legend{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:24px;font-size:10px;color:#8e9fb4}
.role-chart-legend span{display:flex;align-items:center;gap:6px}
.role-chart-legend i{width:7px;height:7px;background:#c4ab69;display:inline-block}
.role-session-chart>.role-chart-empty{margin-top:18px}

.sessions .session-card.is-oneshot{border-left-width:1px}

.search-select{position:relative;min-width:0;display:flex;flex-direction:column;gap:9px}
.search-select>label{position:relative;display:block}
.search-select>label .optional-label{position:absolute;right:0;top:1px}
.search-select-control{display:flex;position:relative;min-width:0}
.search-select-control input{width:100%;padding-right:39px}
.search-select-control>button{position:absolute;right:1px;top:1px;bottom:1px;width:36px;padding:0;border:0;background:transparent;color:#a4b3c8}
.search-select-control>button:disabled{cursor:not-allowed}
.search-select-menu{position:absolute;z-index:5;top:100%;left:0;right:0;background:#202836;border:1px solid #4a5870;border-radius:4px;box-shadow:0 10px 24px #0007;margin-top:4px;overflow:hidden}
.search-select-menu [role=listbox]{max-height:190px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#667283 #222834}
.search-select-menu button{display:block;width:100%;text-align:left;border:0;border-radius:0;background:transparent;padding:11px 12px;font-size:12px;overflow-wrap:anywhere}
.search-select-menu button:hover,.search-select-menu button[aria-selected=true]{background:#8fb9961f;color:#b9d7c0}
.search-select-menu p{font-size:11px;margin:0;padding:12px}
.module-field .search-select input:disabled{opacity:.65;cursor:not-allowed;background:#2d3043;color:#cbc9a3;border-color:#5d5b45}
